name = "budget-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
routes = [
  { pattern = "api.safelyspend.app", custom_domain = true }
]

[vars]
ENVIRONMENT = "production"
FROM_EMAIL = "auth@safelyspend.app"
APP_URL = "https://safelyspend.app"

[[d1_databases]]
binding = "DB"
database_name = "budget-db"
database_id = "f7728e3f-47aa-4dc6-8a03-a4f4166194da"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "VAULT_BUCKET"
bucket_name = "budget-vaults"

[triggers]
crons = ["0 3 * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1
